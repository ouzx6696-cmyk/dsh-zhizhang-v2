<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>织章工作台</title>
  <link rel="stylesheet" href="./workbench.css">
  <script src="./workbench.js" type="module"></script>
</head>
<body>
  <header class="top">
    <a href="./workbench" class="brand"><span aria-hidden="true">织</span>织章工作台</a>
    <div class="regions"><button id="navigation-toggle" aria-pressed="true">目录</button><button id="pipeline-toggle" aria-pressed="true">流程</button></div>
  </header>
  <div class="layout" id="layout">
    <aside aria-label="目录" id="navigation">
      <label for="projects">项目</label>
      <select id="projects"><option value="">选择项目</option></select>
      <details>
        <summary>新建项目</summary>
        <form id="new-project">
          <label>项目名称<input name="name" required maxlength="120"></label>
          <label>产品线<select name="product"><option value="fanqie">番茄连载</option><option value="toutiao">头条创作</option></select></label>
          <button type="submit">创建项目</button>
        </form>
      </details>
      <div id="document-tools" hidden>
        <h2>稿件</h2>
        <nav id="documents" aria-label="稿件"></nav>
        <details>
          <summary>新建稿件</summary>
          <form id="new-document">
            <label>名称<input name="title" maxlength="120"></label><output id="new-title-count"></output>
            <div id="article-options" hidden>
              <label>体裁<select name="mode"><option value="short">短图文</option><option value="long">长图文</option><option value="micro">微头条</option></select></label>
              <label>内容线<select name="line"><option>资讯线</option><option>故事线</option></select></label>
            </div>
            <button type="submit">创建稿件</button>
          </form>
        </details>
      </div>
    </aside>
    <main>
      <div id="notice" class="notice" role="status" hidden></div>
      <section id="empty"><h1>开始写作</h1><p>从目录新建或打开一个项目，再选择一份稿件。</p></section>
      <section id="manuscript" aria-labelledby="heading" hidden>
        <div class="heading">
          <div><p id="document-label" class="eyebrow"></p><h1 id="heading"></h1></div>
          <span id="state" class="state"></span>
        </div>
        <label for="body" class="visually-hidden">正文</label>
        <textarea id="body" spellcheck="false" placeholder="写下正文…" rows="16"></textarea>
        <form id="rename" hidden>
          <label>当前标题<input name="title" required></label>
          <output id="title-count"></output>
          <label>应用标题候选<select id="title-choices"><option value="">选择候选</option></select></label>
          <button type="submit">保存标题</button>
        </form>
        <div class="editor-footer"><span id="draft-status"></span><button id="save" class="primary">保存正文</button></div>
        <section id="comparison" hidden>
          <h2>候选稿</h2>
          <label for="candidate" class="visually-hidden">候选正文</label>
          <textarea id="candidate" readonly rows="8"></textarea>
          <p id="candidate-qa" hidden></p>
          <div class="actions"><button id="adopt" class="primary">采纳候选稿</button><button id="discard">舍弃</button></div>
        </section>
      </section>
    </main>
    <aside aria-label="流程" id="pipeline">
      <h2>写作流程</h2>
      <p id="flow-empty">打开一份稿件查看流程。</p>
      <div id="flow-content" hidden>
        <div id="fanqie-actions" hidden>
          <p id="reviews"></p>
          <div class="actions">
            <button id="review-pass">审稿通过</button><button id="review-reject">打回</button>
            <button id="finalize" class="primary">定稿</button>
          </div>
        </div>
        <div id="toutiao-actions" hidden>
          <p id="article-report" hidden></p><p id="export-status" hidden></p><form id="qa">
            <label>质检评分<input name="score" type="number" min="0" max="100" required></label>
            <label class="check"><input name="passed" type="checkbox">质检已通过</label>
            <label>未通过项<textarea name="fails" rows="2" placeholder="每行一项"></textarea></label>
            <button type="submit">记录质检</button>
          </form>
          <div class="actions">
            <button id="refine">保存回改稿</button><button id="accept">验收</button><button id="reject">退回</button>
            <button id="approve">批准交稿</button><button id="deliver" class="primary">交稿</button>
          </div>
          <a id="download" hidden download="交稿单.md">下载交稿单</a>
        </div>
        <details id="planning">
          <summary>写作规划</summary>
          <form id="chapter-outline" hidden>
            <label>视角<input name="viewpoint" required></label>
            <label>目标篇幅<input name="target" type="number" min="1" value="2200" required></label>
            <label>锁定事实<textarea name="lockedFacts" rows="2" required></textarea></label>
            <label>人物知识边界<textarea name="knowledge" rows="2" required></textarea></label>
            <label>剧情梗概<textarea name="剧情梗概" rows="2" required></textarea></label>
            <label>核心冲突与看点<textarea name="核心冲突与看点" rows="2" required></textarea></label>
            <label>情节推进节点<textarea name="情节推进节点" rows="2" required></textarea></label>
            <label>章末落点<textarea name="章末落点" rows="2" required></textarea></label>
            <button type="submit">保存章纲</button>
          </form>
          <form id="article-plan" hidden>
            <label>驱动<select name="driver" required></select></label>
            <label>开头<select name="opening" required></select></label>
            <label>结尾<select name="ending" required></select></label>
            <label id="title-matrix">标题候选<textarea name="titles" rows="3" placeholder="每行一个标题 | 母题"></textarea></label>
            <button type="submit">保存场景规划</button>
          </form>
        </details>
        <details id="continuity" hidden>
          <summary>设定与章序</summary>
          <form id="setting-proposal">
            <label>设定编号<input name="factId" required></label>
            <label>设定内容<textarea name="note" rows="3" required></textarea></label>
            <label>来源<input name="source" required></label>
            <label>知情人物<input name="character"></label>
            <label>生效章内段落<input name="point" type="number" min="1" value="1" required></label>
            <label class="check"><input name="locked" type="checkbox">锁定设定</label>
            <button type="submit">提交设定提案</button>
          </form>
          <form id="settings-read">
            <label>查询人物<input name="character" required></label>
            <label>章内段落<input name="point" type="number" min="1" value="1" required></label>
            <button type="submit">查看人物所知</button>
          </form>
          <div id="known-settings"></div>
          <div id="settings"></div><button id="settings-more" hidden>更多设定</button>
          <form id="record-evidence">
            <label>设定编号<input name="factId" required></label>
            <label>已保存正文中的原句<input name="quote" required></label>
            <button>记录正文证据</button><button type="button" id="evidence-detail">查看最近证据</button><output id="evidence-result"></output>
          </form>
          <div class="actions"><button id="move-up">上移本章</button><button id="move-down">下移本章</button></div>
        </details>
        <details id="run-details">
          <summary>候选写作</summary>
          <form id="start-run">
            <label>写作要求<textarea name="instruction" rows="3" required></textarea></label>
            <label>令牌预算<input name="tokenLimit" type="number" min="1" required></label>
            <output id="budget-hint"></output>
            <label id="run-point">知情查询段落<input name="point" type="number" min="1" value="1"></label>
            <button type="submit">创建写作任务</button>
          </form>
          <div id="run-content" hidden>
            <p id="run-status"></p>
            <button type="button" id="run-detail">查看冻结输入和调用记录</button><pre id="run-input" hidden></pre>
            <button type="button" id="run-history">查看任务历史</button><div id="run-history-list"></div>
            <form id="reconcile" hidden><label>未记账的令牌数<input name="tokens" type="number" min="0" required></label><button>确认用量</button></form>
            <form id="generate-run">
              <label>DsH 模型提供方<input name="provider" value="deepseek-account" required></label>
              <label>模型<input name="model" value="deepseek-flash" required></label>
              <label id="automatic-qa" class="check" hidden><input name="autoQa" type="checkbox">生成后质检，最多自动回改两轮</label>
              <button type="submit">用 DsH 生成候选稿</button><button type="button" id="refresh-run">刷新任务</button>
            </form>
            <form id="complete-run">
              <label>候选正文<textarea name="body" rows="5" required></textarea></label>
              <label>实际令牌用量<input name="tokens" type="number" min="0" required></label>
              <button type="submit">导入候选稿</button>
            </form>
            <button id="cancel">取消任务</button>
          </div>
        </details>
      </div>
    </aside>
  </div>
</body>
</html>
